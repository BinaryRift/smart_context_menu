name: smart_context_menu_example
description: "Example app demonstrating the smart_context_menu package."
publish_to: 'none'

version: 1.0.4+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  smart_context_menu:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Latin subsets of two fonts under the SIL Open Font License, for the
  # Terminal and Paper cards of Appearance: system fonts differ by platform.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
