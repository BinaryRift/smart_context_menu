name: smart_context_menu
description: "A powerful, fully customizable iOS-style context menu: smart positioning, fluid animations, drag-to-select, rich submenus (async, paginated) and your own content above the widget."
version: 0.9.0
repository: https://github.com/BinaryRift/smart_context_menu
issue_tracker: https://github.com/BinaryRift/smart_context_menu/issues
topics:
  - context-menu
  - menu
  - popup
  - overlay
  - cupertino
screenshots:
  - description: "A long press opens the menu of a file, and a finger slides across the items to select one."
    path: doc/gifs/open_and_select.gif

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The version is pinned by flutter_test.
  leak_tracker_flutter_testing: any
