name: smart_context_menu
description: "A powerful, customizable iOS-style context menu: smart positioning, fluid animations, drag-to-select, submenus (async, paginated), and widgets above the preview (e.g. reactions)."
version: 1.1.0
repository: https://github.com/BinaryRift/smart_context_menu
issue_tracker: https://github.com/BinaryRift/smart_context_menu/issues
topics:
  - context-menu
  - menu
  - popup
  - overlay
  - chat-context-menu
screenshots:
  - description: "File and chat menus in light and dark themes show drag-to-select, from the row of the file menu down its list and down the chat menu under a reactions bar."
    path: doc/gifs/open_and_select_themes.gif
  - description: "A light file menu with an action row, a dark chat menu with a reactions bar, and a dark drawing toolbar with colored icons."
    path: doc/gifs/carousel_cover.webp
  - description: "Four styles of the menu in the light and dark themes: brand colors, an opaque menu, items with their own content and rows in their own style."
    path: doc/gifs/appearance.png
  - description: "Rows of compact actions in the light and dark themes: a row above the list, a menu of rows only, seven tools in a wider menu and a submenu of one row."
    path: doc/gifs/rows.png
  - description: "Green terminal, tiny menu, cyan glow, editing and clipboard rows, warm paper, icons in colored squares, indigo with a row, and a seven-tool drawing toolbar."
    path: doc/gifs/themes.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The version is pinned by flutter_test.
  leak_tracker_flutter_testing: any

flutter:
  shaders:
    - lib/src/ui/shaders/smart_context_menu_glass.frag
