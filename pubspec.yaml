name: smart_context_menu
description: "A powerful, fully customizable iOS-style context menu: smart positioning, fluid animations, drag-to-select, rich submenus (async, paginated) and your own content above the widget."
version: 1.0.1
repository: https://github.com/BinaryRift/smart_context_menu
issue_tracker: https://github.com/BinaryRift/smart_context_menu/issues
topics:
  - context-menu
  - menu
  - popup
  - overlay
  - chat-context-menu
screenshots:
  - description: "A long press opens the menu of a file, and a finger slides across the items to select one."
    path: doc/gifs/open_and_select.gif
  - description: "The menu lines up with the left edge, the center or the right edge of the widget, and a widget low on the screen moves up to fit the menu."
    path: doc/gifs/positioning.png
  - description: "Three styles of the menu in the light and dark themes: brand colors, an opaque menu and items with their own content."
    path: doc/gifs/appearance.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The version is pinned by flutter_test.
  leak_tracker_flutter_testing: any
